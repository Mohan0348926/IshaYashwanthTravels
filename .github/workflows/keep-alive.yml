
name: Keep Isha Yashwanth Travels Active

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Website
        run: |
          echo "Checking Render Website..."

          curl --fail --silent --show-error \
            --location \
            --max-time 120 \
            --output /dev/null \
            --write-out 'HTTP Status: %{http_code}\nFirst Byte: %{time_starttransfer}s\nTotal Time: %{time_total}s\n' \
            "https://ishayashwanthtravels.onrender.com/"

          echo "Ping Completed"
