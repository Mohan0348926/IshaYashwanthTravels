
name: Keep Ishaya Yashwanth Travels Active

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Website
        run: |
          echo "Checking Render website..."

          curl --fail-with-body -L -sS \
            --retry 2 \
            --retry-delay 5 \
            --max-time 120 \
            -o /dev/null \
            -w 'HTTP Status: %{http_code}\nFirst Byte: %{time_starttransfer}s\nTotal Time: %{time_total}s\n' \
            "https://ishayashwanthtravels.onrender.com/"

          echo "Ping finished"
